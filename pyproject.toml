[project]
name = "allee"
version = "0.1.0"
description = "Allee: an agentic street-tree planner on open city data (Zürich, Berlin, anywhere OSM covers)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=1.26",
  "pydantic>=2.7",
  "anthropic>=0.40",
  "openai>=1.60",
  "python-dotenv>=1.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["server", "server.adapters", "server.engine", "server.agent"]
